name: GitHub Pages'a Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: SEO bütünlük kontrolü
        run: python3 scripts/check_seo.py
      - name: Yalnız yayın dosyalarını hazırla
        run: python3 scripts/build_public.py
      - name: Chromium test ortamı
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Yayından önce tarayıcı kontrolü
        run: python3 scripts/check_browser.py
      - name: Alan adı DNS kontrolü
        run: |
          echo "Kök alan adı A kayıtları"
          dig +short visnebahcesi.com A
          echo "www CNAME kaydı"
          dig +short www.visnebahcesi.com CNAME
          echo "Yetkili ad sunucuları"
          dig +short visnebahcesi.com NS
          echo "Hostinger yetkili sunucusundaki A kayıtları"
          dig +short @aurora.dns-parking.com visnebahcesi.com A
          echo "Hostinger yetkili sunucusundaki www kaydı"
          dig +short @aurora.dns-parking.com www.visnebahcesi.com CNAME
      - name: Pages yapılandırması
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4

name: GitHub Pages'a Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Alan adı DNS kontrolü
        run: |
          echo "Kök alan adı A kayıtları"
          dig +short visnebahcesi.com A
          echo "www CNAME kaydı"
          dig +short www.visnebahcesi.com CNAME
          echo "Yetkili ad sunucuları"
          dig +short visnebahcesi.com NS
          echo "Hostinger yetkili sunucusundaki A kayıtları"
          dig +short @aurora.dns-parking.com visnebahcesi.com A
          echo "Hostinger yetkili sunucusundaki www kaydı"
          dig +short @aurora.dns-parking.com www.visnebahcesi.com CNAME
      - name: Pages yapılandırması
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
